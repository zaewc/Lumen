# cargo-deny configuration (ADR-0026). Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# Vulnerable, unmaintained and unsound crates are reported from the RustSec
# advisory database. Any ignore entry needs an issue link and an expiry plan.
yanked = "deny"
ignore = [
  # proc-macro-error is unmaintained (not vulnerable): a compile-time macro used
  # by glib-macros in Tauri's Linux GTK3 stack (ADR-0004); it never runs in the
  # app. Upstream: https://github.com/tauri-apps/tauri/issues/10910, resolved by
  # the GTK4 migration (https://github.com/tauri-apps/tauri/issues/7335).
  # Review by 2027-01-18 or when Tauri moves to GTK4.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained compile-time macro in Tauri's Linux GTK3 stack; tauri-apps/tauri#10910" },
  # basic-toml is unmaintained (not vulnerable): askama_derive reads its template
  # config with it at compile time, inside uniffi_bindgen, which generates the
  # mobile bindings (ADR-0007). It never runs in any shipped binary, and no
  # askama or uniffi release without it exists yet. Review by 2027-01-20 or when
  # uniffi moves to an askama without basic-toml.
  { id = "RUSTSEC-2026-0374", reason = "unmaintained compile-time TOML parser in askama_derive, via uniffi_bindgen; no safe upgrade yet" },
]

[licenses]
version = 2
# Permissive licenses only. Adding a license (especially copyleft) is a
# reviewed change with a justification in the pull request.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  # MIT without the attribution clause; strictly more permissive than MIT.
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
# The allow-list is policy, not an inventory: entries may be unused.
unused-allowed-license = "allow"
# Workspace crates (Apache-2.0, publish = false) are not license-checked as dependencies.
private = { ignore = true }

# Crate-scoped exceptions, each with its reason.
[[licenses.exceptions]]
# Mozilla's CA certificate list as data (CDLA-Permissive-2.0, a permissive data
# license). Pulled in by rustls-platform-verifier for platforms without a usable
# OS trust store; none of Lumen's targets (macOS, Windows, Linux, Android, iOS)
# compile it, which `cargo tree --target` confirms.
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# UniFFI (ADR-0007), the Kotlin and Swift bindings for the mobile core:
# MPL-2.0, approved by the owner on 2026-10-16 for these crates only. MPL-2.0 is
# file-level copyleft: Lumen's own code is unaffected; changes to UniFFI's files,
# or to the binding files it generates, would be published if shipped. No other
# crate may use MPL-2.0 without its own review.
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_bindgen"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_udl"
allow = ["MPL-2.0"]

# Tauri (ADR-0004), the desktop shell: MPL-2.0 crates in its dependency tree,
# approved by the owner on 2026-10-18 for these crates only. cssparser,
# cssparser-macros, dtoa-short and selectors (Servo) do the HTML handling that
# injects the CSP and runs the isolation pattern; option-ext comes with dirs.
# File-level copyleft, as for UniFFI above.
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
