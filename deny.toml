# cargo-deny configuration (ADR-0026). Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# Vulnerable, unmaintained and unsound crates are reported from the RustSec
# advisory database. Any ignore entry needs an issue link and an expiry plan.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. Adding a license (especially copyleft) is a
# reviewed change with a justification in the pull request.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
# The allow-list is policy, not an inventory: entries may be unused.
unused-allowed-license = "allow"
# Workspace crates are publish = false and carry no license yet.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
