# cargo-deny configuration (ADR-0026). Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# Vulnerable, unmaintained and unsound crates are reported from the RustSec
# advisory database. Any ignore entry needs an issue link and an expiry plan.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. Adding a license (especially copyleft) is a
# reviewed change with a justification in the pull request.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  # MIT without the attribution clause; strictly more permissive than MIT.
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
# The allow-list is policy, not an inventory: entries may be unused.
unused-allowed-license = "allow"
# Workspace crates (Apache-2.0, publish = false) are not license-checked as dependencies.
private = { ignore = true }

# Crate-scoped exceptions, each with its reason.
[[licenses.exceptions]]
# Mozilla's CA certificate list as data (CDLA-Permissive-2.0, a permissive data
# license). Pulled in by rustls-platform-verifier for platforms without a usable
# OS trust store; none of Lumen's targets (macOS, Windows, Linux, Android, iOS)
# compile it, which `cargo tree --target` confirms.
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# UniFFI (ADR-0007), the Kotlin and Swift bindings for the mobile core:
# MPL-2.0, approved by the owner on 2026-10-16 for these crates only. MPL-2.0 is
# file-level copyleft: Lumen's own code is unaffected; changes to UniFFI's files,
# or to the binding files it generates, would be published if shipped. No other
# crate may use MPL-2.0 without its own review.
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_bindgen"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_udl"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
