# Reviewed OSV-Scanner exceptions (ADR-0026). Each one names the advisory, why
# it cannot be reached or fixed now, and an expiry so it is reviewed again.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-16T00:00:00Z
reason = """
braces <= 3.0.3: stack exhaustion from deeply nested brace patterns supplied \
by an attacker; no fixed version exists (advisory published 2026-09-18). It \
reaches the repository only through steiger (dev-only FSD linter) -> globby -> \
fast-glob/micromatch, which expand glob patterns from Lumen's own config over \
Lumen's own source tree. No untrusted pattern reaches it and nothing ships in \
the app. Re-check for a fixed braces or a steiger without it before expiry.\
"""

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-27T00:00:00Z
reason = """
block-buffer < 0.12.1: a panic inside the caller's compression callback can \
leave EagerBuffer/ReadBuffer's cursor out of range. block-buffer 0.10.4 comes \
only through digest 0.10 -> sha2 0.10 -> tauri-codegen, which Tauri's build \
script and proc macros use to hash bundled assets at compile time; it is not \
in the shipped app's runtime. SHA-256 compression never panics, so the \
corrupting path is not reachable, and the fix exists only in the 0.12 line \
(digest 0.11). Re-check when Tauri moves to sha2 0.11 before expiry.\
"""

[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2027-01-25T00:00:00Z
reason = """
zod <= 4.6.5 (alias CVE-2023-54404): memory exhaustion when an array schema \
without a length limit validates a huge array. Lumen's own code (apps/web, \
packages/api-client) uses zod 4.6.7, which is fixed. zod 3.25.76 remains only \
through development tools: @expo/cli (the `expo` command; 58.1.15, the latest, \
still requires ^3.25.76; never part of the app bundle) and steiger -> \
zod-validation-error (dev-only FSD linter). Both validate the developer's own \
config files, never untrusted input, and no 3.x release is fixed. Re-check \
for an @expo/cli and steiger on zod 4 before expiry.\
"""

[[IgnoredVulns]]
id = "CVE-2023-54404"
ignoreUntil = 2027-01-25T00:00:00Z
reason = "Alias of GHSA-mrhx-c7xc-m3w5 (zod array validation); see that entry."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2027-01-18T00:00:00Z
reason = """
glib 0.18.5 (alias GHSA-wrw7-89jp-8q8g): unsound VariantStrIter, fixed in \
glib 0.20. It comes only with Tauri's Linux GTK3 stack (gtk 0.18, \
webkit2gtk), whose bindings cannot move to glib 0.20; neither Lumen nor Tauri \
iterates GLib variants, and upstream judged it not to affect Tauri \
(tauri-apps/tauri#12048, closed in favour of the GTK4 move, #7335). Review \
when Tauri moves to GTK4.\
"""

