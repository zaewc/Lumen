# Reviewed OSV-Scanner exceptions (ADR-0026). Each one names the advisory, why
# it cannot be reached or fixed now, and an expiry so it is reviewed again.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-16T00:00:00Z
reason = """
braces <= 3.0.3: stack exhaustion from deeply nested brace patterns supplied \
by an attacker; no fixed version exists (advisory published 2026-09-18). It \
reaches the repository only through steiger (dev-only FSD linter) -> globby -> \
fast-glob/micromatch, which expand glob patterns from Lumen's own config over \
Lumen's own source tree. No untrusted pattern reaches it and nothing ships in \
the app. Re-check for a fixed braces or a steiger without it before expiry.\
"""

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2027-01-18T00:00:00Z
reason = """
glib 0.18.5 (alias GHSA-wrw7-89jp-8q8g): unsound VariantStrIter, fixed in \
glib 0.20. It comes only with Tauri's Linux GTK3 stack (gtk 0.18, \
webkit2gtk), whose bindings cannot move to glib 0.20; neither Lumen nor Tauri \
iterates GLib variants, and upstream judged it not to affect Tauri \
(tauri-apps/tauri#12048, closed in favour of the GTK4 move, #7335). Review \
when Tauri moves to GTK4.\
"""

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
ignoreUntil = 2027-01-18T00:00:00Z
reason = "Alias of RUSTSEC-2024-0429 (glib VariantStrIter); see that entry."

[[IgnoredVulns]]
