# Reviewed OSV-Scanner exceptions (ADR-0026). Each one names the advisory, why
# it cannot be reached or fixed now, and an expiry so it is reviewed again.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-16T00:00:00Z
reason = """
braces <= 3.0.3: stack exhaustion from deeply nested brace patterns supplied \
by an attacker; no fixed version exists (advisory published 2026-09-18). It \
reaches the repository only through steiger (dev-only FSD linter) -> globby -> \
fast-glob/micromatch, which expand glob patterns from Lumen's own config over \
Lumen's own source tree. No untrusted pattern reaches it and nothing ships in \
the app. Re-check for a fixed braces or a steiger without it before expiry.\
"""

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2027-01-18T00:00:00Z
reason = """
glib 0.18.5 (alias GHSA-wrw7-89jp-8q8g): unsound VariantStrIter, fixed in \
glib 0.20. It comes only with Tauri's Linux GTK3 stack (gtk 0.18, \
webkit2gtk), whose bindings cannot move to glib 0.20; neither Lumen nor Tauri \
iterates GLib variants, and upstream judged it not to affect Tauri \
(tauri-apps/tauri#12048, closed in favour of the GTK4 move, #7335). Review \
when Tauri moves to GTK4.\
"""

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
ignoreUntil = 2027-01-18T00:00:00Z
reason = "Alias of RUSTSEC-2024-0429 (glib VariantStrIter); see that entry."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
ignoreUntil = 2027-01-18T00:00:00Z
reason = """
proc-macro-error is unmaintained, not vulnerable: a compile-time macro used \
by glib-macros in Tauri's Linux GTK3 stack; it never runs in the app. Also \
ignored in deny.toml. Upstream: tauri-apps/tauri#10910.\
"""

[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
ignoreUntil = 2027-01-19T00:00:00Z
reason = """
node-forge <= 1.4.0: RSA PKCS#1 v1.5 verification accepts padded \
DigestAlgorithm sequences (forgery with low-exponent keys); no fixed version \
yet. It comes only with the Expo CLI (dev tool): @expo/cli parses the \
developer's own iOS signing certificates and @expo/code-signing-certificates \
signs and checks the developer's own expo-updates certificates. No signature \
from an untrusted party is verified and nothing of it ships in the app. \
Re-check for a fixed node-forge before expiry.\
"""

[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
ignoreUntil = 2027-01-19T00:00:00Z
reason = """
uuid < 11.1.1: v3()/v5()/v6() do not bounds-check a caller-provided output \
buffer. Only xcode@3.0.1 (Expo prebuild, dev tool) uses uuid 7.0.3, and it \
calls uuid.v4() only (pbxProject.js), which is not affected. Re-check when \
@expo/config-plugins moves off xcode 3.\
"""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0374"
ignoreUntil = 2027-01-20T00:00:00Z
reason = """
basic-toml 0.1.10 is unmaintained (not a vulnerability). askama_derive parses \
its template config with it at compile time inside uniffi_bindgen, which \
generates the mobile bindings (ADR-0007); it never runs in a shipped binary. \
No askama or uniffi release without it exists yet. Review when uniffi moves \
to an askama that drops basic-toml.\
"""
