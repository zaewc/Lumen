[workspace]
members = ["crates/*", "xtask"]
# A virtual manifest has no edition to infer the resolver from (ADR-0003).
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.0.0"
publish = false
repository = "https://github.com/zaewc/Lumen"

[workspace.dependencies]
# Every dependency needs a reason (AGENTS.md); see the PR that added it.
lumen-application = { path = "crates/lumen-application" }
lumen-domain = { path = "crates/lumen-domain" }
blake3 = "1.8.7"
# Test-only validator; defaults pull an HTTP client and a TLS stack we do not need.
jsonschema = { version = "0.58.5", default-features = false }
proptest = "1.11.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Default groups (correctness, suspicious, complexity, perf, style) stay on.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Cherry-picked restriction lints (ADR-0003).
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
let_underscore_must_use = "warn"
disallowed_methods = "deny"

[profile.release]
debug = "line-tables-only"
# Unwinding keeps an adapter panic from aborting a host mid-operation (ADR-0004).
panic = "unwind"
