[workspace]
members = ["crates/*", "xtask"]
# A virtual manifest has no edition to infer the resolver from (ADR-0003).
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.0.0"
publish = false
repository = "https://github.com/zaewc/Lumen"
license = "Apache-2.0"

[workspace.dependencies]
# Every dependency needs a reason (AGENTS.md); see the PR that added it.
lumen-application = { path = "crates/lumen-application" }
lumen-cli = { path = "crates/lumen-cli" }
lumen-devkb = { path = "crates/lumen-devkb" }
lumen-domain = { path = "crates/lumen-domain" }
lumen-fs-exec = { path = "crates/lumen-fs-exec" }
lumen-graph = { path = "crates/lumen-graph" }
lumen-jev = { path = "crates/lumen-jev" }
lumen-jev-eval = { path = "crates/lumen-jev-eval" }
lumen-platform-macos = { path = "crates/lumen-platform-macos" }
lumen-platform-windows = { path = "crates/lumen-platform-windows" }
lumen-policy = { path = "crates/lumen-policy" }
lumen-scan = { path = "crates/lumen-scan" }
lumen-store-sqlite = { path = "crates/lumen-store-sqlite" }
lumen-testkit = { path = "crates/lumen-testkit" }
blake3 = "1.8.7"
# Benchmarks only (roadmap 5.19); default features add plotting we do not use.
criterion = { version = "0.8.2", default-features = false }
# libdispatch queues for the FSEvents stream (macOS adapter only).
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
# FFI declarations for getattrlistbulk(2) and friends (macOS adapter only).
libc = "0.2.190"
# Typed CoreFoundation / CoreServices (FSEvents) bindings (macOS adapter only).
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std"] }
# Code-signing (Security framework) bindings for the app inventory (macOS only).
objc2-security = { version = "0.3.2", default-features = false, features = ["std"] }
# Test-only validator; defaults pull an HTTP client and a TLS stack we do not need.
jsonschema = { version = "0.58.5", default-features = false }
proptest = "1.11.0"
# Bundled SQLite guarantees the WAL-reset fix (ADR-0012); defaults add a wasm FFI we do not use.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }
rusqlite_migration = "2.6.0"
# Handle-relative filesystem calls for the executor (ADR-0016): openat, statat,
# renameat with no-replace (renameatx_np on Apple, renameat2 on Linux).
rustix = { version = "1.1.5", default-features = false, features = ["fs", "process", "std"] }
# TLS for the Jev transport (ADR-0031): ring provider, no default features.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
# Win32 FFI declarations for the Windows adapter (raw-dylib, no build script).
windows-sys = "0.61.2"
thiserror = "2.0.21"
# Blocking HTTPS client for the Jev transport (ADR-0031): rustls with the OS
# trust store (platform verifier), no bundled roots, no compression.
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
uuid = { version = "1.27.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Default groups (correctness, suspicious, complexity, perf, style) stay on.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Cherry-picked restriction lints (ADR-0003).
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
let_underscore_must_use = "warn"
disallowed_methods = "deny"

[profile.release]
debug = "line-tables-only"
# Unwinding keeps an adapter panic from aborting a host mid-operation (ADR-0004).
panic = "unwind"
