# JavaScript workspace (ADR-0024). Turborepo runs the JS task graph; Cargo,
# Xcode and Gradle keep their native builds.
packages:
  - apps/*
  - packages/*

# Exact versions, declared once (ADR-0024: `catalogMode: strict`).
catalogMode: strict
catalog:
  "@biomejs/biome": 2.5.15
  "@feature-sliced/steiger-plugin": 0.8.0
  "@hey-api/openapi-ts": 0.99.0
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-query": 5.104.2
  "@tanstack/react-router": 1.170.43
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  react: 19.3.0
  react-dom: 19.3.0
  steiger: 0.7.0
  tailwindcss: 4.3.3
  turbo: 2.11.7
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 5.0.4
  zod: 4.6.7

# TypeScript 7 has no compiler API until 7.1, so a package whose tools need it
# (the API client's generator) takes the TypeScript 6 compatibility package
# as its `typescript`; type checks still run TypeScript 7 (ADR-0025).
catalogs:
  ts6:
    typescript: npm:@typescript/typescript6@6.0.2

# Supply-chain defaults (ADR-0024, ADR-0026): a release must be 3 days old
# before it can be installed, exotic transitive sources are refused, a package
# whose trust level drops is refused, and no dependency may run install
# scripts unless it is listed here.
minimumReleaseAge: 4320
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Reviewed exceptions to the trust policy, each pinned to one version.
trustPolicyExclude:
  # Steiger needs ^4.0.3. 4.0.2 and 4.0.3 (December 2024) were published by
  # the same maintainer account as every other release, without provenance;
  # earlier and later releases carry attestations. Not a takeover.
  - chokidar@4.0.3
strictDepBuilds: true
allowBuilds: {}


# Security fixes for transitive dependencies, each with its advisory.
overrides:
  # GHSA-2883-xcg3-v3hh, GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj (CVSS 7.5),
  # fixed in 4.3.2; pulled in by @hey-api/json-schema-ref-parser, which pins
  # 4.2.0.
  "js-yaml@<4.3.2": 4.3.2
