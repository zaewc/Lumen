name: secret-scan

on:
  pull_request:
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
      - name: Install gitleaks from Go modules
        env:
          GOTOOLCHAIN: go1.25.0
          GOPROXY: "https://proxy.golang.org"
          GOSUMDB: sum.golang.org
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan git history
        run: '"$HOME/go/bin/gitleaks" git --no-banner --redact --verbose .'
