name: bench

# Benchmarks on CI hardware, on demand only: shared runners are too noisy to
# gate pull requests on timings (docs/architecture/performance.md).
on:
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Benchmarks
        run: cargo bench --locked -p lumen-scan -p lumen-policy -p lumen-cluster
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-${{ matrix.os }}
          path: target/criterion
          retention-days: 30
