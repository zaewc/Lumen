name: release

# Release artifacts (ADR-0026): the CLI and the desktop app for each
# platform, with CycloneDX SBOMs, SHA-256 checksums and build-provenance attestations, published as a
# draft release on a `v*` tag. Builds are unsigned until signing lands
# (roadmap 12.8). Pull requests that change this workflow run the builds as a
# dry run; nothing is attested or published from them.
#
# Tag runs compile Lumen's built-in Jeb key (ADR-0042) into the CLI and the
# desktop app: the secret `JEB_API_KEY` of the `release` environment, given
# only to the two compile steps. Pull request runs reference no environment
# and pass an empty value, so they never receive it.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      # Each target reports its own result; the release still needs all three.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # Tag runs only: the environment that holds the built-in Jeb key.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    # Build scripts of dependencies run here, so this job can read the
    # repository and nothing else: no tokens to sign or publish with.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: release builds start clean (ADR-0026).
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Check that the tag matches the version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "lumen-cli") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match lumen-cli $version"
            exit 1
          fi
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          # Read by `option_env!` in lumen-app (ADR-0042); empty unless a tag
          # run. Masked in logs.
          LUMEN_JEB_BUILTIN_KEY: ${{ github.event_name == 'push' && secrets.JEB_API_KEY || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -z "$LUMEN_JEB_BUILTIN_KEY" ]; then
            echo "::error::the release environment has no JEB_API_KEY secret (ADR-0042)"
            exit 1
          fi
          cargo build --release --locked -p lumen-cli --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="lumen-$TARGET"
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/$TARGET/release/lumen.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            cp "target/$TARGET/release/lumen" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -r "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The desktop app, unsigned until roadmap 12.8: a universal macOS disk
  # image, a per-user Windows installer, and Linux .deb and AppImage packages.
  desktop:
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: universal-apple-darwin
            # `app` too: the in-app updater's archive is made from it.
            bundles: app,dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    # Tag runs only: the environment that holds the built-in Jeb key.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # Blocked like the build and SBOM jobs (roadmap 13.d): the hosts the
      # 0.2.0 run reached, from its log: the Ubuntu mirror and Microsoft's
      # package repository, the toolchains and registries, the AppImage tools
      # Tauri downloads from GitHub releases, and the artifact upload.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            registry.npmjs.org:443
            nodejs.org:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Add both macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install the desktop host's system libraries (Tauri on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # Release builds never restore a cache (ADR-0026).
          package-manager-cache: false
      - name: Check that the tag matches the app version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the desktop app $version"
            exit 1
          fi
      - name: Install the workspace exactly as locked
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Bundle
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          TURBO_TELEMETRY_DISABLED: "1"
          # Read by `option_env!` in lumen-app (ADR-0042); empty unless a tag
          # run. Masked in logs.
          LUMEN_JEB_BUILTIN_KEY: ${{ github.event_name == 'push' && secrets.JEB_API_KEY || '' }}
          # Signs the in-app updater's artifacts (ADR-0048); tag runs only.
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          updater=()
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ -z "$LUMEN_JEB_BUILTIN_KEY" ]; then
              echo "::error::the release environment has no JEB_API_KEY secret (ADR-0042)"
              exit 1
            fi
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "::error::the release environment has no TAURI_SIGNING_PRIVATE_KEY secret (ADR-0048)"
              exit 1
            fi
            updater=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          pnpm --filter @lumen/desktop tauri build --ci --target "$TARGET" --bundles "$BUNDLES" "${updater[@]}"
      - name: Collect
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          find "target/$TARGET/release/bundle" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} dist/ \;
          # The updater's macOS archive is named after the app only; give it
          # the version, like the other files (its signature covers the bytes).
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ -f dist/Lumen.app.tar.gz ]; then
            mv dist/Lumen.app.tar.gz "dist/Lumen_${version}_universal.app.tar.gz"
            mv dist/Lumen.app.tar.gz.sig "dist/Lumen_${version}_universal.app.tar.gz.sig"
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # SBOMs come from Cargo.lock, not the binaries, so one Linux job with egress
  # blocked writes them for every target.
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-cyclonedx@0.5.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # Release builds never restore a cache (ADR-0026).
          package-manager-cache: false
      # The dependencies compiled into each target's binary.
      - name: SBOMs
        run: |
          mkdir dist
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            cargo cyclonedx --manifest-path crates/lumen-cli/Cargo.toml \
              --format json --spec-version 1.5 --target "$target" \
              --override-filename "lumen-$target.cdx"
            cp "crates/lumen-cli/lumen-$target.cdx.json" dist/
            cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml \
              --format json --spec-version 1.5 --target "$target" \
              --override-filename "lumen-desktop-$target.cdx"
            cp "apps/desktop/src-tauri/lumen-desktop-$target.cdx.json" dist/
          done
          # The desktop app's interface: the web packages bundled into it.
          corepack enable
          pnpm --filter @lumen/web sbom --lockfile-only --prod \
            --sbom-format cyclonedx --sbom-spec-version 1.5 --sbom-type application \
            --out "$PWD/dist/lumen-desktop-web.cdx.json"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest
    needs: [build, desktop, sbom]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Only first-party actions run with the signing token; no repository code.
    permissions:
      id-token: write # a Sigstore signing certificate for the attestation
      attestations: write # store the attestation with the repository
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # The in-app updater's manifest (ADR-0048): each platform's file and its
      # signature, served from the release once it is published. Written
      # before the checksums so it is attested with the rest.
      - name: Update manifest
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mac="Lumen_${version}_universal.app.tar.gz"
          win="Lumen_${version}_x64-setup.exe"
          linux="Lumen_${version}_amd64.AppImage"
          for file in "$mac" "$win" "$linux"; do
            if [ ! -s "$file" ] || [ ! -s "$file.sig" ]; then
              echo "::error::missing $file or its signature for the updater"
              exit 1
            fi
          done
          jq -n \
            --arg version "$version" \
            --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac "$base/$mac" --rawfile mac_sig "$mac.sig" \
            --arg win "$base/$win" --rawfile win_sig "$win.sig" \
            --arg linux "$base/$linux" --rawfile linux_sig "$linux.sig" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": {url: $mac, signature: ($mac_sig | rtrimstr("\n"))},
              "darwin-x86_64": {url: $mac, signature: ($mac_sig | rtrimstr("\n"))},
              "windows-x86_64": {url: $win, signature: ($win_sig | rtrimstr("\n"))},
              "linux-x86_64": {url: $linux, signature: ($linux_sig | rtrimstr("\n"))}
            }}' > latest.json
          cat latest.json
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: |
            dist/SHA256SUMS
            dist/latest.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: draft release
    needs: attest
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release and upload its files
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # A draft: the owner reviews it and publishes it by hand.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes dist/*
