name: bench-compare

# A pull request that changes a benchmarked crate runs that crate's benchmarks
# on its base and on itself, on one runner, and shows the changes in the job
# summary (scripts/bench-compare.sh). Informational, never required: shared
# runners are too noisy to gate on timings (docs/architecture/performance.md).
on:
  pull_request:
    paths:
      - crates/lumen-cluster/**
      - crates/lumen-scan/**
      - crates/lumen-policy/**
      - Cargo.lock
      - scripts/bench-compare.sh
      - .github/workflows/bench-compare.yml

permissions: {}

concurrency:
  group: bench-compare-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  compare:
    name: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Benchmarks, base against this pull request
        run: scripts/bench-compare.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: criterion
          path: target/criterion
          retention-days: 14
          if-no-files-found: ignore
