name: workflow-lint

on:
  pull_request:
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint from Go modules
        env:
          GOTOOLCHAIN: go1.25.0
          GOPROXY: "https://proxy.golang.org"
          GOSUMDB: sum.golang.org
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # shellcheck is preinstalled on ubuntu runners and checks run: scripts.
      - run: '"$HOME/go/bin/actionlint" -color'
      - name: Claude Code guard hooks block what they should, and only that (ADR-0056)
        run: |
          shellcheck .claude/hooks/*.sh
          .claude/hooks/test-guards.sh
      - name: Local agent recovery scenarios (temporary Git fixtures, no remote writes)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts/agent_harness -p 'test_*.py' -v

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: zizmor@1.30.1
      - name: Audit workflows
        env:
          # Online audits (impostor commits, known-vulnerable actions) use the API read-only.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github --no-progress .
