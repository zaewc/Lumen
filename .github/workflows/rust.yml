name: rust

on:
  pull_request:
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    # Whether this pull request is documentation-only (scripts/ci-changes.sh).
    # Jobs below skip their expensive steps when the answer is `false`, and run
    # everything for any other answer, including none when this job fails.
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            *.actions.githubusercontent.com:443
            actions-results-receiver-production.githubapp.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Documentation only?
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: scripts/ci-changes.sh

  fmt:
    name: fmt
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check

  check:
    name: check (${{ matrix.os }})
    needs: changes
    # A matrix job skipped as a whole reports one unexpanded name, which never
    # satisfies the required `check (<os>)` checks, so a documentation-only
    # change runs the job and skips its steps instead.
    if: ${{ !cancelled() }}
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: env.RUN == 'true' && runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        if: env.RUN == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.RUN == 'true'
        with:
          # Caches written by pull requests could poison later runs (ADR-0026).
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Install the desktop host's system libraries (Tauri on Linux)
        if: env.RUN == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        if: env.RUN == 'true'
        with:
          tool: cargo-nextest
      - name: Clippy
        if: env.RUN == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        if: env.RUN == 'true'
        run: cargo nextest run --workspace --locked --no-tests=warn
      # Tests that write to the OS credential store run only on disposable CI
      # runners, never by default on a developer's machine.
      - name: Credential store tests
        if: env.RUN == 'true' && runner.os == 'macOS'
        run: cargo nextest run -p lumen-platform-macos --locked --run-ignored ignored-only
      - name: Credential store tests
        if: env.RUN == 'true' && runner.os == 'Windows'
        run: cargo nextest run -p lumen-platform-windows --locked --run-ignored ignored-only
      - name: Doctests
        if: env.RUN == 'true'
        run: cargo test --workspace --doc --locked

  msrv:
    name: msrv
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned and MSRV toolchains
        # The MSRV is read from Cargo.toml so it has a single source (ADR-0003).
        run: |
          rustup toolchain install
          msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].rust_version] | unique | .[]')
          echo "MSRV: ${msrv}"
          rustup toolchain install "${msrv}" --profile minimal
      - name: Install the desktop host's system libraries (Tauri on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-hack
      - name: Check every crate builds on its declared rust-version
        run: cargo hack check --rust-version --workspace --locked

  android:
    name: android
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and Android targets
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Mobile core for Android, 16 KB page alignment and Kotlin bindings (ADR-0007)
        # The runner image ships several NDKs; use the newest (r28+ is required).
        run: ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME}" cargo xtask android
      # The generated Kotlin must compile before an app ever builds it: a field
      # named `message` once clashed with Throwable.message (#292).
      - name: Compile the generated Kotlin bindings
        env:
          KOTLIN_VERSION: 2.4.20
          KOTLIN_SHA256: 59e9ca74c7904ef2c122b12114937673ccce68de820a663f0ed66ccf8799e0b7
          JNA_VERSION: 5.19.1
          JNA_SHA256: 4fb141dd8ef6b0585ffceea4bc49602fbc6312fa977e2c488794ea3e6aafecae
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o kotlin.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_SHA256}  kotlin.zip" | sha256sum -c -
          curl -fsSL -o jna.jar \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna/${JNA_VERSION}/jna-${JNA_VERSION}.jar"
          echo "${JNA_SHA256}  jna.jar" | sha256sum -c -
          unzip -q kotlin.zip
          ./kotlinc/bin/kotlinc "$GITHUB_WORKSPACE/target/android/kotlin" -cp jna.jar -d bindings.jar

  ios:
    name: ios
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and iOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Mobile core for iOS as an XCFramework, Swift bindings proven on the host (ADR-0007)
        run: cargo xtask ios

  schemas:
    name: schemas
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Committed JSON Schemas match the Rust types (ADR-0011)
        if: needs.changes.outputs.code != 'false'
        run: cargo xtask schema --check
      - name: Crate layering, pure-crate IO, ADR index and documentation links (ADR-0056)
        run: cargo xtask lint
