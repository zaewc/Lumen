name: codeql

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    # Query packs improve over time; re-analyse weekly (Wednesday 04:23 UTC).
    - cron: "23 4 * * 3"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Whether this pull request is documentation-only (scripts/ci-changes.sh).
    # Jobs below skip their expensive steps when the answer is `false`, and run
    # everything for any other answer, including none when this job fails.
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            *.actions.githubusercontent.com:443
            actions-results-receiver-production.githubapp.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Documentation only?
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: scripts/ci-changes.sh

  analyze:
    name: analyze (${{ matrix.language }})
    needs: changes
    # Runs and skips its steps for a documentation-only change, so the required
    # `analyze (<language>)` checks still report (see scripts/ci-changes.sh).
    if: ${{ !cancelled() }}
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers the web UI, the desktop isolation script,
        # the mobile app, the download site and the generated API client.
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: env.RUN == 'true'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: env.RUN == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: env.RUN == 'true'
        with:
          category: /language:${{ matrix.language }}
