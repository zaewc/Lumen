// The photo library for the app (ADR-0007): MediaStore.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.lumen.photos'
version = '0.0.0'

android {
  namespace "dev.lumen.photos"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
