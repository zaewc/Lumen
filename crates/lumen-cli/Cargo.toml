[package]
name = "lumen-cli"
description = "Lumen's developer command line: read-only scans with coverage and size reports."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
# The composition root shared with the desktop host (roadmap 11.2).
lumen-app.workspace = true
lumen-application.workspace = true
# Jev's API key check and judge (roadmap 10.17).
lumen-jev.workspace = true
lumen-domain.workspace = true
lumen-scan.workspace = true
# Local, redacted logs (ADR-0022, roadmap 12.4).
lumen-telemetry.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Reading what a run recorded in the index.
lumen-store-sqlite.workspace = true
lumen-testkit.workspace = true

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
