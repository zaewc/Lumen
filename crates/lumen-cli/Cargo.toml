[package]
name = "lumen-cli"
description = "Lumen's developer command line: read-only scans with coverage and size reports."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
lumen-application.workspace = true
# Assessment (roadmap 10.13b): knowledge base and policy context.
lumen-devkb.workspace = true
lumen-graph.workspace = true
lumen-policy.workspace = true
lumen-domain.workspace = true
lumen-scan.workspace = true
lumen-store-sqlite.workspace = true
serde_json.workspace = true
# Time-ordered scan and snapshot IDs.
uuid = { workspace = true, features = ["v7"] }

[target.'cfg(target_os = "macos")'.dependencies]
lumen-platform-macos.workspace = true

[target.'cfg(windows)'.dependencies]
lumen-platform-windows.workspace = true

[dev-dependencies]
lumen-testkit.workspace = true

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
