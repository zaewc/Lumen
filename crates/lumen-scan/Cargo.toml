[package]
name = "lumen-scan"
description = "Lumen's scan engine and the portable std::fs directory enumerator."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Adversarial checks other enumerator crates run in their tests (`conformance`).
conformance = ["dep:lumen-testkit"]

[dependencies]
lumen-application.workspace = true
lumen-domain.workspace = true
lumen-testkit = { workspace = true, optional = true }

[dev-dependencies]
# The crate's own integration tests run the conformance suite.
lumen-scan = { workspace = true, features = ["conformance"] }
lumen-testkit.workspace = true
proptest.workspace = true

[lints]
workspace = true
