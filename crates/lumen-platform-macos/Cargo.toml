[package]
name = "lumen-platform-macos"
description = "Lumen's macOS platform adapter: the getattrlistbulk directory enumerator."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
lumen-application.workspace = true
lumen-domain.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
blake3.workspace = true
block2.workspace = true
dispatch2.workspace = true
libc.workspace = true
# Homebrew's install receipts are JSON (#806); already a workspace dependency.
serde_json.workspace = true
objc2-core-foundation = { workspace = true, features = [
  "CFArray",
  "CFBundle",
  "CFData",
  "CFDate",
  "CFDictionary",
  "CFError",
  "CFNumber",
  "CFPropertyList",
  "CFString",
  "CFURL",
  "CFUUID",
] }
objc2-core-services = { workspace = true, features = ["FSEvents", "MDItem", "Metadata", "dispatch2", "libc"] }
objc2 = { workspace = true }
# NSRunningApplication: quitting an app (16.3a). NSWorkspace through
# NSGraphicsContext: drawing an app's icon small (16.4).
objc2-app-kit = { workspace = true, features = [
  "NSBitmapImageRep",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSRunningApplication",
  "NSWorkspace",
  "libc",
  "objc2-core-foundation",
] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSURL"] }
objc2-service-management = { workspace = true, features = ["SMAppService", "objc2", "objc2-foundation"] }
objc2-security = { workspace = true, features = ["CSCommon", "SecBase", "SecCode", "SecItem", "SecStaticCode"] }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
lumen-scan = { workspace = true, features = ["conformance"] }
lumen-application.workspace = true
lumen-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "bulk"
harness = false
