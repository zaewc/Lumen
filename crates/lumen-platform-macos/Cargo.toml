[package]
name = "lumen-platform-macos"
description = "Lumen's macOS platform adapter: the getattrlistbulk directory enumerator."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
lumen-application.workspace = true
lumen-domain.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2.workspace = true
libc.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFString", "CFUUID"] }
objc2-core-services = { workspace = true, features = ["FSEvents", "dispatch2", "libc"] }

[dev-dependencies]
proptest.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
lumen-scan.workspace = true
lumen-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
