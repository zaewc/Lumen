[package]
name = "lumen-platform-macos"
description = "Lumen's macOS platform adapter: the getattrlistbulk directory enumerator."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
lumen-application.workspace = true
lumen-domain.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
blake3.workspace = true
block2.workspace = true
dispatch2.workspace = true
libc.workspace = true
# Homebrew's install receipts are JSON (#806); already a workspace dependency.
serde_json.workspace = true
objc2-core-foundation = { workspace = true, features = [
  "CFArray",
  "CFBundle",
  "CFData",
  "CFDate",
  "CFDictionary",
  "CFError",
  "CFNumber",
  "CFPropertyList",
  "CFString",
  "CFURL",
  "CFUUID",
] }
objc2-core-services = { workspace = true, features = ["FSEvents", "MDItem", "Metadata", "dispatch2", "libc"] }
objc2-app-kit = { workspace = true, features = ["NSRunningApplication", "libc"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSString", "NSURL"] }
objc2-security = { workspace = true, features = ["CSCommon", "SecBase", "SecCode", "SecItem", "SecStaticCode"] }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
lumen-scan = { workspace = true, features = ["conformance"] }
lumen-application.workspace = true
lumen-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "bulk"
harness = false
