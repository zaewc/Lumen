[package]
name = "lumen-platform-linux"
description = "Lumen's Linux platform adapter: content reads for duplicate analysis and installed packages."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
lumen-application.workspace = true
lumen-domain.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Content IDs for duplicate analysis (ADR-0019), as on macOS and Windows.
blake3.workspace = true
# `openat2(RESOLVE_NO_SYMLINKS)` and `fstatfs`, without `unsafe`; already the
# executor's and scanner's system-call crate.
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
lumen-scan.workspace = true
lumen-testkit.workspace = true

[lints]
workspace = true
