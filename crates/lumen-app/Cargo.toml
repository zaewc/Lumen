[package]
name = "lumen-app"
description = "Lumen's composition root as a library: the platform adapters wired to the use cases, for the CLI and the desktop host."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
lumen-application.workspace = true
# Assessment (roadmap 10.13b): knowledge base, graph and policy context.
lumen-devkb.workspace = true
lumen-domain.workspace = true
lumen-graph.workspace = true
# Jev requests are built from metadata only (ADR-0020).
lumen-jev.workspace = true
lumen-policy.workspace = true
lumen-scan.workspace = true
lumen-store-sqlite.workspace = true
# The AI review setting file (ADR-0037).
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Spans and summary events for local telemetry (ADR-0022, roadmap 12.4).
tracing.workspace = true
# Time-ordered scan, snapshot, plan and operation IDs.
uuid = { workspace = true, features = ["v7"] }

[target.'cfg(any(unix, windows))'.dependencies]
# Quarantine, restore and finalize: the executor.
lumen-fs-exec.workspace = true

[target.'cfg(unix)'.dependencies]
# `geteuid`, to refuse running as root.
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
lumen-platform-macos.workspace = true

[target.'cfg(windows)'.dependencies]
lumen-platform-windows.workspace = true

[dev-dependencies]
lumen-testkit.workspace = true

[lints]
workspace = true
